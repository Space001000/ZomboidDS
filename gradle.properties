org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true

# --- Companion app connection (override with -P on the command line) ---
# 127.0.0.1 works on the Thor itself, and on any device after `adb reverse tcp:7786 tcp:7786`.
# Use 10.0.2.2 to reach a mock server on your PC from the Android emulator.
zomboidds.host=127.0.0.1
zomboidds.port=7786

# --- Bridge ---
# Set pz.gameDir in local.properties (not here, it is machine-specific) to the Project Zomboid
# install dir containing projectzomboid.jar. The B42 adapter compiles against it:
# pz.gameDir=C:/Program Files (x86)/Steam/steamapps/common/ProjectZomboid

# --- ZombieBuddy (required by the mod; not shipped by us) ---
# The version tested on device. The bridge compiles against it; the companion app downloads it
# from ZombieBuddy's GitHub on the user's request and verifies these hashes first.
zombieBuddy.version=2.3.3
# SHA-256 of the release's ZombieBuddy.jar
zombieBuddy.jarSha256=c000c1ab79873314db73f53b971ae004272aa145c03a0a42f1a61279c54837fe
# Digest of the mod files (42/, common/, LICENSE.txt) in the tag's source archive; see ZombieBuddyFetcher
zombieBuddy.modFilesSha256=8880c62be33eb0bb86806af938a975d63f02bfcb36f270cd47f6f4f319d67b87
