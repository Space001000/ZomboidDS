<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark Device Background -->
  <rect width="512" height="512" rx="112" fill="#121212"/>

  <!-- Top Screen (Cardboard Top) -->
  <rect x="112" y="96" width="288" height="144" rx="16" fill="#8f6b4d"/>
  <!-- Top Packing Tape -->
  <rect x="236" y="96" width="40" height="144" fill="#bd9e82"/>
  <!-- Top Edge Highlight -->
  <rect x="112" y="96" width="288" height="8" rx="4" fill="#ffffff" opacity="0.15"/>

  <!-- Center Hinge / Gap -->
  <rect x="112" y="248" width="288" height="16" rx="8" fill="#080808"/>

  <!-- Bottom Screen (Cardboard Bottom) -->
  <rect x="112" y="272" width="288" height="144" rx="16" fill="#8f6b4d"/>
  <!-- Bottom Packing Tape -->
  <rect x="236" y="272" width="40" height="144" fill="#bd9e82"/>
  <!-- Bottom Edge Highlight -->
  <rect x="112" y="272" width="288" height="8" rx="4" fill="#ffffff" opacity="0.1"/>

  <!-- Subtle UI Grid Etched into Bottom Box -->
  <rect x="136" y="304" width="40" height="40" rx="8" fill="#000000" opacity="0.25"/>
  <rect x="184" y="304" width="40" height="40" rx="8" fill="#000000" opacity="0.25"/>
  <rect x="136" y="352" width="40" height="40" rx="8" fill="#000000" opacity="0.25"/>
  <rect x="184" y="352" width="40" height="40" rx="8" fill="#000000" opacity="0.25"/>

  <!-- Blood Splatter Top -->
  <circle cx="344" cy="180" r="22" fill="#8a0303"/>
  <circle cx="318" cy="196" r="10" fill="#8a0303"/>
  <circle cx="356" cy="216" r="14" fill="#8a0303"/>
  <circle cx="334" cy="235" r="12" fill="#8a0303"/>

  <!-- Blood Splatter Dripping onto Bottom -->
  <circle cx="328" cy="285" r="14" fill="#8a0303"/>
  <circle cx="352" cy="305" r="18" fill="#8a0303"/>
  <circle cx="368" cy="280" r="8" fill="#8a0303"/>
  <circle cx="344" cy="335" r="10" fill="#8a0303"/>
  <circle cx="338" cy="355" r="6" fill="#8a0303"/>
</svg>
